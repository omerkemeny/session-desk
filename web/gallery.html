<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sprite Gallery</title>
<style>
  :root { --ink: #1f2b1c; --muted: #5a6955; --page: #fafbf8; --line: #cbd8be; --tile: #f1f6ea }
  @media (prefers-color-scheme: dark) { :root { --ink: #e6efdf; --muted: #9bab94; --page: #0e140d; --line: #304030 } }
  body { margin: 0; padding: 16px 24px 48px; background: var(--page); color: var(--ink); font: 14px/1.4 system-ui, sans-serif }
  h1 { font-size: 20px; margin: 0 0 4px } h1 + p { margin: 0 0 12px; color: var(--muted) }
  h2 { font-size: 15px; margin: 28px 0 8px } h2 small { font-weight: 400; color: var(--muted) }
  .bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 10px 0; background: var(--page); border-bottom: 1px solid var(--line) }
  select, button { font: inherit; color: inherit; background: transparent; border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; cursor: pointer }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 4px }
  figcaption { font-size: 12px; color: var(--muted); text-align: center }
  figure button { font-size: 11px; padding: 0 6px }
  .well { display: grid; place-items: end center; padding: 10px; min-width: 40px; background: var(--tile); border: 1px solid var(--line); border-radius: 4px }
  .pix, .looks > div { image-rendering: pixelated; background-repeat: no-repeat }
  .looks { display: grid; border: 1px solid var(--line); border-radius: 4px; max-width: calc(100vw - 32px); overflow-x: auto }
  @media (max-width: 600px) { body { padding: 12px 16px 32px } }
</style>
</head>
<body>
<h1>Sprite gallery</h1>
<p>Every sprite the app draws, from the same sprite code and the art files in <code>web/art/</code>.</p>
<main id="gallery"></main>
<script type="module">
  import { mount } from './src/gallery.js';
  mount(document.getElementById('gallery'));
</script>
</body>
</html>
